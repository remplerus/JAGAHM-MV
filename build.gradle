plugins {
    id("java-library")
    id("maven-publish")
    id("net.neoforged.moddev") version "2.0.+"
    id("idea")
    id("me.modmuss50.mod-publish-plugin") version "1.1.0"
}

stonecutter {
    def agricraft = findProperty("agricraft_version")?.toString()?.trim()
    constants["agricraft"] = (agricraft != null && !agricraft.isEmpty())

    def mysticalagriculture = findProperty("mysticalagriculture_version")?.toString()?.trim()
    constants["mysticalagriculture"] = (mysticalagriculture != null && !mysticalagriculture.isEmpty())
}

version = "${property("mod_version")}-${property("mod_loader")}-${stonecutter.current.version}"
group = mod_group_id
base {
    archivesName = mod_id
}

java {
    withSourcesJar()
    targetCompatibility = property("java_version")
    sourceCompatibility = property("java_version")
}

repositories {
    maven {
        url = "https://maven.blakesmods.com"
    }
    maven {
        url = "https://cursemaven.com"
    }
    maven {
        url = "https://maven.blamejared.com"
    }
}

dependencies {
    def mysticalVersion = findProperty("mysticalagriculture_version")?.toString()?.trim()
    if (mysticalVersion) {
        implementation "com.blakebr0.mysticalagriculture:MysticalAgriculture:${stonecutter.current.version}-${mysticalagriculture_version}"
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.register("buildAndCollect") {
    dependsOn("build")
    // Builds the version into a shared folder in `build/libs/${mod version}/`
    doLast {
        group = "build"
        //from(jar.map { it.archiveFile })
        into("../../libs/${project.property("mod_version")}")
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
    minecraft_version      : minecraft_version,
    minecraft_version_range: minecraft_version_range,
    neo_version            : neo_version,
    loader_version_range   : loader_version_range,
    mod_id                 : mod_id,
    mod_name               : mod_name,
    mod_license            : mod_license,
    mod_version            : mod_version,
    mod_authors            : mod_authors,
    mod_description        : mod_description
    ]
    inputs.properties replaceProperties
            expand replaceProperties
            from "../../src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishMods {
    file = jar.archiveFile.get()
    displayName = "${property("mod_name")} ${property("mod_version")} for ${stonecutter.current.version}"
    version = property("mod_version") as String
    changelog = rootProject.file("CHANGELOG.md").getText()
    type = STABLE
    modLoaders.add("neoforge")

    dryRun = providers.gradleProperty("MODRINTH_TOKEN").getOrNull() == null
        || providers.gradleProperty("CURSEFORGE_TOKEN").getOrNull() == null

    modrinth {
        projectId = property("publish.modrinth") as String
        accessToken = providers.gradleProperty("MODRINTH_TOKEN")
        minecraftVersions.add(stonecutter.current.version)
    }

    curseforge {
        projectId = property("publish.curseforge") as String
        accessToken = providers.gradleProperty("CURSEFORGE_TOKEN")
        minecraftVersions.add(stonecutter.current.version)
    }
}

publishing {
    repositories {
        maven {
            name = "RemplersRepo"
            url = "https://maven.rempler.com/releases/"
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }

    publications {
        register('mavenJava', MavenPublication) {
            groupId "${property("mod_group_id")}.${property("mod_loader")}"
            artifactId "${property("mod_id")}-${property("mod_loader")}-${property("mod_version")}"
            version stonecutter.current.version
            from components.java
        }
    }
}
